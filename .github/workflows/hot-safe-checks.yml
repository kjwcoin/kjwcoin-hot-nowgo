name: HOT safe PR checks
on:
  # Run on branch commits even while this workflow is absent from main.
  push:
    branches:
      - 'feature/hot-spice-median-v1'
      - 'fix/hot-november-release-validation'
  pull_request:
    paths:
      - 'source/lib/hot-spice.ts'
      - 'source/lib/hot-spice.test.ts'
      - 'source/lib/owner-taste-level.ts'
      - 'source/lib/owner-taste-level.test.ts'
      - 'source/lib/owner-publish-permission.ts'
      - 'source/lib/owner-publish-permission.test.ts'
      - 'source/lib/owner-save-readback.ts'
      - 'source/lib/owner-save-readback.test.ts'
      - 'source/lib/customer-save-readback.ts'
      - 'source/lib/customer-save-readback.test.ts'
      - 'source/lib/optional-readonly-rpc.ts'
      - 'source/lib/optional-readonly-rpc.test.ts'
      - 'source/lib/menu-catalog.ts'
      - 'source/lib/menu-search.ts'
      - 'source/lib/menu-search.test.ts'
      - 'source/app/api/[action]/route.ts'
      - 'source/app/api/owner/manage/route.ts'
      - 'source/lib/hot-stage-consistency.test.ts'
      - 'source/lib/hot-owner-rpc-migration.test.ts'
      - 'source/lib/hot-owner-rpc-readback-plan.test.ts'
      - 'source/supabase/migrations/20261019001000_hot_owner_rpc_access.sql'
      - 'source/supabase/tests/hot_owner_rpc_readback.sql'
      - 'source/lib/menus.ts'
      - 'source/lib/hot-pr49-merge-contract.test.ts'
      - 'source/app/account/join/page.tsx'
      - 'source/app/account/callback/page.tsx'
      - 'source/app/api/naver-search/route.ts'
      - 'source/lib/naver-spicy-menu.ts'
      - 'source/lib/naver-spicy-menu.test.ts'
      - 'source/components/hot-spice-rating.tsx'
      - 'source/app/api/spice-ratings/route.ts'
      - '.github/workflows/hot-safe-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spice-and-evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce KST work window
        id: window
        run: |
          hour="$(TZ=Asia/Seoul date +%H)"
          if [ "$hour" -lt 9 ] || [ "$hour" -gt 21 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: '22.13.1'
      - name: Run 1-7 spice median and licensed-menu evidence unit tests
        if: steps.window.outputs.allowed == 'true'
        working-directory: source
        run: node --experimental-strip-types --test lib/*.test.ts

