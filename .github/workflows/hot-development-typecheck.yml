name: HOT development TypeScript QA (no deployment)
on:
  push:
    branches:
      - 'feature/hot-spice-median-v1'
    paths:
      - 'source/lib/**'
      - 'source/app/**'
      - 'source/components/**'
      - 'source/tsconfig.json'
      - 'source/pnpm-lock.yaml'
      - '.github/workflows/hot-development-typecheck.yml'
  pull_request:
    paths:
      - 'source/lib/**'
      - 'source/app/**'
      - 'source/components/**'
      - 'source/tsconfig.json'
      - '.github/workflows/hot-development-typecheck.yml'
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enforce KST work window
        id: window
        run: |
          hour="$(TZ=Asia/Seoul date +%H)"
          if [ "$hour" -lt 9 ] || [ "$hour" -gt 21 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Outside KST window: no checkout, installs or QA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: '22.13.1'
      - name: Install pinned pnpm
        if: steps.window.outputs.allowed == 'true'
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies from existing lockfile
        if: steps.window.outputs.allowed == 'true'
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Typecheck entire HOT source tree
        if: steps.window.outputs.allowed == 'true'
        working-directory: source
        run: pnpm exec tsc --noEmit --incremental false
