name: Owner signup seven-stage regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  owner-signup-seven:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/owner-signup-seven.test.mjs
      - run: pnpm exec tsc --noEmit --incremental false
