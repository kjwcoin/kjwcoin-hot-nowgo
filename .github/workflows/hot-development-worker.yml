name: NOWGO HOT safe development worker
on:
  push:
    branches:
      - feature/hot-spice-median-v1
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: nowgo-hot-safe-worker
  cancel-in-progress: false

jobs:
  read-only-development-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Enforce Korea working window
        id: gate
        shell: bash
        run: |
          hour="$(TZ=Asia/Seoul date +%H)"
          minute="$(TZ=Asia/Seoul date +%M)"
          if [ "$hour" -lt 9 ] || [ "$hour" -gt 21 ] || { [ "$hour" -eq 21 ] && [ "$minute" -ge 45 ]; }; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "KST work window closed: no repository checks or tests performed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout development branch without persistent credentials
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Test seven-stage policy, median, and safe permissions
        if: steps.gate.outputs.allowed == 'true'
        working-directory: source
        run: |
          node --experimental-strip-types --test \
            lib/hot-spice.test.ts \
            lib/owner-taste-level.test.ts \
            lib/hot-stage-consistency.test.ts \
            lib/naver-spicy-menu.test.ts \
            lib/owner-publish-permission.test.ts \
            lib/owner-save-readback.test.ts \
            lib/customer-save-readback.test.ts \
            lib/optional-readonly-rpc.test.ts \
            lib/hot-pr49-merge-contract.test.ts

      - name: Read linked GitHub issues and PR
        if: ${{ always() && steps.gate.outputs.allowed == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const [a,b,p] = await Promise.all([
              github.rest.issues.get({owner,repo,issue_number:48}),
              github.rest.issues.get({owner,repo,issue_number:50}),
              github.rest.pulls.get({owner,repo,pull_number:49}),
            ]);
            await core.summary
              .addHeading('HOT development worker (read only)',2)
              .addRaw('KST: '+new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+'\\n\\n')
              .addTable([
                [{data:'Item',header:true},{data:'Status',header:true}],
                ['Issue #48',a.data.state],
                ['Issue #50',b.data.state],
                ['PR #49',p.data.state+' / '+(p.data.draft?'Draft':'Ready')],
                ['PR head',p.data.head.sha],
              ])
              .addRaw('No database mutation, external data collection, deployment, merge, or payment executed.')
              .write();
            if(p.data.merged) core.setFailed('Safety violation: PR #49 unexpectedly merged.');
